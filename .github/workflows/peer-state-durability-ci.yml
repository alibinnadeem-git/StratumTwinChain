name: STRATUM Peer State Durability CI
on:
  pull_request:
    paths:
      - 'tools/portable-validator/peer_sync_evidence_journal.go'
      - 'tools/portable-validator/peer_head_state.go'
      - 'tools/portable-validator/peer_sync_follower_status.go'
      - 'tools/portable-validator/peer_sync_quarantine.go'
      - 'tools/portable-validator/peer_reliability.go'
      - 'tools/portable-validator/peer_proof_cache.go'
      - '.github/workflows/peer-state-durability-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/portable-validator/peer_sync_evidence_journal.go'
      - 'tools/portable-validator/peer_head_state.go'
      - 'tools/portable-validator/peer_sync_follower_status.go'
      - 'tools/portable-validator/peer_sync_quarantine.go'
      - 'tools/portable-validator/peer_reliability.go'
      - 'tools/portable-validator/peer_proof_cache.go'
      - '.github/workflows/peer-state-durability-ci.yml'

jobs:
  peer-state-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/portable-validator/go.mod
      - name: Go formatting check
        working-directory: tools/portable-validator
        run: |
          gofmt -w peer_sync_evidence_journal.go peer_head_state.go peer_sync_follower_status.go peer_sync_quarantine.go peer_reliability.go peer_proof_cache.go
          git diff --exit-code -- peer_sync_evidence_journal.go peer_head_state.go peer_sync_follower_status.go peer_sync_quarantine.go peer_reliability.go peer_proof_cache.go
      - name: Go vet
        working-directory: tools/portable-validator
        run: go vet ./...
      - name: Peer state race tests
        working-directory: tools/portable-validator
        run: go test -race ./... -run 'Test(PeerEvidenceJournal|PeerHeadState|RecordAuthenticatedPeerHead|PeerFollowerStatus|PeerQuarantine|RecordPeerSafetyFailure|PeerReliability|ProofCache)'
      - name: Crash-durability and non-authority invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const directAtomicPaths=[
            'tools/portable-validator/peer_sync_evidence_journal.go',
            'tools/portable-validator/peer_head_state.go',
            'tools/portable-validator/peer_sync_follower_status.go',
            'tools/portable-validator/peer_sync_quarantine.go',
            'tools/portable-validator/peer_reliability.go',
          ];
          const required=[
            'os.OpenFile(tmp, os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0o600)',
            'f.Sync()',
            'f.Close()',
            'runtime.GOOS == "windows"',
            'os.Rename(tmp, path)',
          ];
          for (const path of directAtomicPaths) {
            const source=fs.readFileSync(path,'utf8');
            for (const invariant of required) {
              if (!source.includes(invariant)) throw new Error(`${path} missing crash-durability invariant: ${invariant}`);
            }
          }
          const head=fs.readFileSync('tools/portable-validator/peer_head_state.go','utf8');
          const evidence=fs.readFileSync('tools/portable-validator/peer_sync_evidence_journal.go','utf8');
          const follower=fs.readFileSync('tools/portable-validator/peer_sync_follower_status.go','utf8');
          const quarantine=fs.readFileSync('tools/portable-validator/peer_sync_quarantine.go','utf8');
          const reliability=fs.readFileSync('tools/portable-validator/peer_reliability.go','utf8');
          const cache=fs.readFileSync('tools/portable-validator/peer_proof_cache.go','utf8');
          if (!head.includes('detectPeerHeadEquivocation') || !head.includes('appendPeerEvidence') || !head.includes('savePeerQuarantineStateAtomic')) throw new Error('Cross-run head state must preserve equivocation evidence/quarantine path');
          if (!evidence.includes('peer evidence does not match local trust context')) throw new Error('Evidence journal must remain trust-context bound');
          if (!follower.includes('follower status must remain non-voting and non-participating')) throw new Error('Follower status must remain non-voting and non-participating');
          if (!quarantine.includes('peerQuarantineProfile')) throw new Error('Quarantine state profile missing');
          if (!reliability.includes('peer reliability state must never enable consensus weighting') || !reliability.includes('refusing to persist peer reliability state with consensus weighting enabled')) throw new Error('Reliability state must remain operational-only and reject consensus weighting');
          for (const invariant of required) {
            if (!cache.includes(invariant)) throw new Error(`Proof cache atomic writer missing crash-durability invariant: ${invariant}`);
          }
          if (!cache.includes('writePeerProofCacheFileAtomic')) throw new Error('Proof cache must share one crash-durable atomic file writer for manifests and verified bundles');
          if (!cache.includes('peer proof cache must never carry consensus authority')) throw new Error('Proof cache must reject consensus authority');
          if (!cache.includes('peer proof cache must never select canonical history')) throw new Error('Proof cache must reject canonical-history selection');
          console.log('Crash-durable peer state persistence and non-authority invariants passed');
          NODE
