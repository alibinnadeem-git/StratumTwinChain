name: STRATUM Peer State Durability CI
on:
  pull_request:
    paths:
      - 'tools/portable-validator/atomic_persistence.go'
      - 'tools/portable-validator/peer_sync.go'
      - 'tools/portable-validator/peer_session.go'
      - 'tools/portable-validator/peer_state_health.go'
      - 'tools/portable-validator/peer_state_health_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_export.go'
      - 'tools/portable-validator/peer_state_diagnostic_export_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify_test.go'
      - 'tools/portable-validator/peer_state_corruption_test.go'
      - 'tools/portable-validator/peer_sync_evidence_journal.go'
      - 'tools/portable-validator/peer_head_state.go'
      - 'tools/portable-validator/peer_sync_follower_status.go'
      - 'tools/portable-validator/peer_sync_quarantine.go'
      - 'tools/portable-validator/peer_reliability.go'
      - 'tools/portable-validator/peer_proof_cache.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/peer-state-durability-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/portable-validator/atomic_persistence.go'
      - 'tools/portable-validator/peer_sync.go'
      - 'tools/portable-validator/peer_session.go'
      - 'tools/portable-validator/peer_state_health.go'
      - 'tools/portable-validator/peer_state_health_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_export.go'
      - 'tools/portable-validator/peer_state_diagnostic_export_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify_test.go'
      - 'tools/portable-validator/peer_state_corruption_test.go'
      - 'tools/portable-validator/peer_sync_evidence_journal.go'
      - 'tools/portable-validator/peer_head_state.go'
      - 'tools/portable-validator/peer_sync_follower_status.go'
      - 'tools/portable-validator/peer_sync_quarantine.go'
      - 'tools/portable-validator/peer_reliability.go'
      - 'tools/portable-validator/peer_proof_cache.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/peer-state-durability-ci.yml'

jobs:
  peer-state-durability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/portable-validator/go.mod
      - name: Go formatting check
        working-directory: tools/portable-validator
        run: |
          gofmt -w atomic_persistence.go peer_sync.go peer_session.go peer_state_health.go peer_state_health_test.go peer_state_diagnostic_export.go peer_state_diagnostic_export_test.go peer_state_diagnostic_verify.go peer_state_diagnostic_verify_test.go peer_state_corruption_test.go peer_sync_evidence_journal.go peer_head_state.go peer_sync_follower_status.go peer_sync_quarantine.go peer_reliability.go peer_proof_cache.go main.go
          git diff --exit-code -- atomic_persistence.go peer_sync.go peer_session.go peer_state_health.go peer_state_health_test.go peer_state_diagnostic_export.go peer_state_diagnostic_export_test.go peer_state_diagnostic_verify.go peer_state_diagnostic_verify_test.go peer_state_corruption_test.go peer_sync_evidence_journal.go peer_head_state.go peer_sync_follower_status.go peer_sync_quarantine.go peer_reliability.go peer_proof_cache.go main.go
      - name: Go vet
        working-directory: tools/portable-validator
        run: go vet ./...
      - name: Peer state race tests
        working-directory: tools/portable-validator
        run: go test -race ./... -run 'Test(PeerSync|PeerSession|PeerStateHealth|PeerStateDiagnostic|PeerEvidenceJournal|PeerHeadState|RecordAuthenticatedPeerHead|PeerFollowerStatus|PeerQuarantine|RecordPeerSafetyFailure|PeerReliability|ProofCache)'
      - name: Crash-durability and non-authority invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const directAtomicPaths=[
            'tools/portable-validator/peer_sync.go',
            'tools/portable-validator/peer_session.go',
            'tools/portable-validator/peer_sync_evidence_journal.go',
            'tools/portable-validator/peer_head_state.go',
            'tools/portable-validator/peer_sync_follower_status.go',
            'tools/portable-validator/peer_sync_quarantine.go',
            'tools/portable-validator/peer_reliability.go',
          ];
          const parentDurablePaths=[...directAtomicPaths];
          const required=[
            'os.OpenFile(tmp, os.O_CREATE|os.O_WRONLY|os.O_TRUNC, 0o600)',
            'f.Sync()',
            'f.Close()',
            'runtime.GOOS == "windows"',
            'os.Rename(tmp, path)',
          ];
          for (const path of directAtomicPaths) {
            const source=fs.readFileSync(path,'utf8');
            for (const invariant of required) {
              if (!source.includes(invariant)) throw new Error(`${path} missing crash-durability invariant: ${invariant}`);
            }
          }
          const atomic=fs.readFileSync('tools/portable-validator/atomic_persistence.go','utf8');
          for (const required of ['syncParentDirectoryAfterRename','runtime.GOOS == "windows"','os.Open(filepath.Dir(path))','dir.Sync()']) {
            if (!atomic.includes(required)) throw new Error(`Missing parent-directory durability helper invariant: ${required}`);
          }
          for (const path of parentDurablePaths) {
            const source=fs.readFileSync(path,'utf8');
            if (!source.includes('syncParentDirectoryAfterRename(path)')) throw new Error(`${path} must sync its parent directory after atomic rename`);
          }

          const sync=fs.readFileSync('tools/portable-validator/peer_sync.go','utf8');
          const session=fs.readFileSync('tools/portable-validator/peer_session.go','utf8');
          const health=fs.readFileSync('tools/portable-validator/peer_state_health.go','utf8');
          const healthTests=fs.readFileSync('tools/portable-validator/peer_state_health_test.go','utf8');
          const diagnostics=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_export.go','utf8');
          const diagnosticTests=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_export_test.go','utf8');
          const verifier=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_verify.go','utf8');
          const verifierTests=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_verify_test.go','utf8');
          const corruptionTests=fs.readFileSync('tools/portable-validator/peer_state_corruption_test.go','utf8');
          const head=fs.readFileSync('tools/portable-validator/peer_head_state.go','utf8');
          const evidence=fs.readFileSync('tools/portable-validator/peer_sync_evidence_journal.go','utf8');
          const follower=fs.readFileSync('tools/portable-validator/peer_sync_follower_status.go','utf8');
          const quarantine=fs.readFileSync('tools/portable-validator/peer_sync_quarantine.go','utf8');
          const reliability=fs.readFileSync('tools/portable-validator/peer_reliability.go','utf8');
          const cache=fs.readFileSync('tools/portable-validator/peer_proof_cache.go','utf8');
          const main=fs.readFileSync('tools/portable-validator/main.go','utf8');

          if (!sync.includes('savePeerSyncTrustedHeadAtomic') || !sync.includes('syncParentDirectoryAfterRename(path)')) throw new Error('Proof-verified trusted head must use parent-directory durable atomic persistence');
          for (const invariant of ['STRATUM-PEER-SESSION/1','OutboundSequence','PeerReplayState','savePeerSessionStateAtomic','read-only peer runtime requires CANDIDATE state with voteAuthority=false']) {
            if (!session.includes(invariant)) throw new Error(`Peer session/replay durability boundary missing invariant: ${invariant}`);
          }
          if (!session.includes('syncParentDirectoryAfterRename(path)')) throw new Error('Peer session/replay state must sync its parent directory after rename');
          for (const required of ['TestPeerSessionStateCorruptionFailsClosed','TestPeerSessionReplayTrustContextCorruptionFailsClosed','TestPeerSyncTrustedHeadCorruptionFailsClosed','TestPeerSyncTrustedHeadInvalidRecordFailsClosed']) {
            if (!corruptionTests.includes(required)) throw new Error(`Missing fail-closed corruption regression: ${required}`);
          }

          for (const required of ['STRATUM-PEER-STATE-HEALTH/1','MISSING_SAFE_DEFAULT','MISSING_OPTIONAL','INVALID_PERSISTED_STATE','MutationPerformed','peer-state-health requires CANDIDATE state with voteAuthority=false','no mutation was performed']) {
            if (!health.includes(required)) throw new Error(`Missing read-only state-health invariant: ${required}`);
          }
          for (const forbidden of ['os.Remove(','os.Rename(','savePeerSyncTrustedHeadAtomic(','savePeerQuarantineStateAtomic(','quarantinePeer(']) {
            if (health.includes(forbidden)) throw new Error(`peer-state-health must remain inspection-only; forbidden mutation surface: ${forbidden}`);
          }
          for (const required of ['TestPeerStateHealthDistinguishesMissingSafeDefaults','TestPeerStateHealthReportsCorruptionWithoutMutation','TestPeerStateHealthRejectsAuthorityEscalationMetadata']) {
            if (!healthTests.includes(required)) throw new Error(`Missing peer-state-health regression: ${required}`);
          }
          if (!main.includes('case "peer-state-health"') || !main.includes('peerStateHealthCommand')) throw new Error('peer-state-health command must remain registered');

          for (const required of ['STRATUM-PEER-STATE-DIAGNOSTIC-EXPORT/1','PrivateKeysIncluded','SourceMutation','peerStateDiagnosticSources','peerStateDiagnosticMaxFileBytes','diagnostic output directory must be outside the validator data directory','refusing to overwrite','writePeerStateDiagnosticFile','sha256.Sum256','syncParentDirectoryAfterRename(outputDir)','peer-state-diagnostic-export requires CANDIDATE state with voteAuthority=false']) {
            if (!diagnostics.includes(required)) throw new Error(`Missing diagnostic-export invariant: ${required}`);
          }
          if (diagnostics.includes('keys/private') || diagnostics.includes('transport.pk8') || diagnostics.includes('consensus.pk8')) throw new Error('Diagnostic export must not reference private-key paths');
          for (const required of ['TestPeerStateDiagnosticExportPreservesCorruptBytesAndExcludesPrivateKeys','TestPeerStateDiagnosticExportRefusesDestinationInsideValidatorDir','TestPeerStateDiagnosticExportRefusesOverwrite']) {
            if (!diagnosticTests.includes(required)) throw new Error(`Missing diagnostic-export regression: ${required}`);
          }
          if (!main.includes('case "peer-state-diagnostic-export"') || !main.includes('peerStateDiagnosticExportCommand')) throw new Error('peer-state-diagnostic-export command must remain registered');

          for (const required of [
            'STRATUM-PEER-STATE-DIAGNOSTIC-VERIFY/1','IntegrityVerified','AuthenticityEstablished','AuthenticityEstablished: false','ConsensusAuthority',
            'diagnosticPathHasForbiddenSegment','unsupported diagnostic export profile','diagnostic manifest violates non-authority/private-key boundary',
            'embedded state-health trust context mismatch','duplicate diagnostic file name','diagnostic file is not in the allowlist','unsafe diagnostic export path',
            'diagnostic file integrity mismatch','diagnostic bundle contains unexpected file','os.Lstat','filepath.Walk'
          ]) if (!verifier.includes(required)) throw new Error(`Missing diagnostic-verifier invariant: ${required}`);
          for (const forbidden of ['os.Remove(','os.Rename(','savePeerSyncTrustedHeadAtomic(','savePeerQuarantineStateAtomic(','quarantinePeer(']) {
            if (verifier.includes(forbidden)) throw new Error(`diagnostic verifier must remain inspection-only; forbidden mutation surface: ${forbidden}`);
          }
          for (const required of [
            'TestPeerStateDiagnosticVerifyValidBundleIntegrityOnly','TestPeerStateDiagnosticVerifyRejectsTamperedFile',
            'TestPeerStateDiagnosticVerifyRejectsUnexpectedOrPrivateKeyPath','TestPeerStateDiagnosticVerifyRejectsManifestAuthorityEscalation',
            'TestPeerStateDiagnosticVerifyRejectsUnexpectedUnlistedFile'
          ]) if (!verifierTests.includes(required)) throw new Error(`Missing diagnostic-verifier regression: ${required}`);
          if (!main.includes('case "peer-state-diagnostic-verify"') || !main.includes('peerStateDiagnosticVerifyCommand')) throw new Error('peer-state-diagnostic-verify command must remain registered');
          if (!main.includes('does not establish who created the bundle')) throw new Error('CLI must preserve integrity-versus-authenticity distinction');

          if (!head.includes('detectPeerHeadEquivocation') || !head.includes('appendPeerEvidence') || !head.includes('savePeerQuarantineStateAtomic')) throw new Error('Cross-run head state must preserve equivocation evidence/quarantine path');
          if (!evidence.includes('peer evidence does not match local trust context')) throw new Error('Evidence journal must remain trust-context bound');
          if (!follower.includes('follower status must remain non-voting and non-participating')) throw new Error('Follower status must remain non-voting and non-participating');
          if (!quarantine.includes('peerQuarantineProfile')) throw new Error('Quarantine state profile missing');
          if (!reliability.includes('peer reliability state must never enable consensus weighting') || !reliability.includes('refusing to persist peer reliability state with consensus weighting enabled')) throw new Error('Reliability state must remain operational-only and reject consensus weighting');
          for (const invariant of required) {
            if (!cache.includes(invariant)) throw new Error(`Proof cache atomic writer missing crash-durability invariant: ${invariant}`);
          }
          if (!cache.includes('writePeerProofCacheFileAtomic')) throw new Error('Proof cache must share one crash-durable atomic file writer for manifests and verified bundles');
          if (!cache.includes('syncParentDirectoryAfterRename(path)')) throw new Error('Proof cache atomic writer must sync its parent directory after rename');
          if (!cache.includes('peer proof cache must never carry consensus authority')) throw new Error('Proof cache must reject consensus authority');
          if (!cache.includes('peer proof cache must never select canonical history')) throw new Error('Proof cache must reject canonical-history selection');
          console.log('Trusted-head, peer session/replay, fail-closed corruption, read-only state health, diagnostic export/verification, and local peer state durability/non-authority invariants passed');
          NODE
