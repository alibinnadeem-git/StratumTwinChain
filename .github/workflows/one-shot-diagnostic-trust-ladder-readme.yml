name: One-shot diagnostic trust ladder README update

on:
  push:
    branches:
      - redbook/povi-proof-verifying-sync-runtime-v1
    paths:
      - '.github/workflows/one-shot-diagnostic-trust-ladder-readme.yml'

permissions:
  contents: write

jobs:
  update-readme-once:
    if: github.event.head_commit.message == 'Fix one-shot diagnostic trust ladder README helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redbook/povi-proof-verifying-sync-runtime-v1
          fetch-depth: 0
      - name: Append diagnostic trust ladder once
        env:
          TRUST_LADDER_B64: 
        run: |
          python3 -c "import base64,os,pathlib; p=pathlib.Path('tools/portable-validator/README.md'); text=p.read_text(); marker='## Diagnostic bundle trust ladder'; section=base64.b64decode(os.environ['TRUST_LADDER_B64']).decode(); p.write_text(text if marker in text else text+section)"
          if git diff --quiet -- tools/portable-validator/README.md; then
            echo 'Trust ladder already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/portable-validator/README.md
          git commit -m 'Document diagnostic trust ladder'
          git push origin HEAD:redbook/povi-proof-verifying-sync-runtime-v1
