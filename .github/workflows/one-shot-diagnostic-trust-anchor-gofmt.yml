name: One-shot diagnostic trust-anchor gofmt

on:
  push:
    branches:
      - redbook/povi-proof-verifying-sync-runtime-v1
    paths:
      - '.github/workflows/one-shot-diagnostic-trust-anchor-gofmt.yml'

permissions:
  contents: write

jobs:
  gofmt-once:
    if: github.event.head_commit.message == 'Add one-shot diagnostic trust anchor gofmt helper'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redbook/povi-proof-verifying-sync-runtime-v1
          fetch-depth: 0
      - name: Format only touched diagnostic trust-anchor Go files
        working-directory: tools/portable-validator
        run: |
          gofmt -w peer_state_diagnostic_trust_anchor.go peer_state_diagnostic_trust_anchor_test.go main.go
      - name: Commit formatting only if needed
        run: |
          if git diff --quiet -- tools/portable-validator/peer_state_diagnostic_trust_anchor.go tools/portable-validator/peer_state_diagnostic_trust_anchor_test.go tools/portable-validator/main.go; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/portable-validator/peer_state_diagnostic_trust_anchor.go tools/portable-validator/peer_state_diagnostic_trust_anchor_test.go tools/portable-validator/main.go
          git commit -m 'Normalize diagnostic trust anchor Go formatting'
          git push origin HEAD:redbook/povi-proof-verifying-sync-runtime-v1
