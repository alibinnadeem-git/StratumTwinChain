name: STRATUM Peer State Diagnostic Compare CI
on:
  pull_request:
    paths:
      - 'tools/portable-validator/peer_state_diagnostic_compare.go'
      - 'tools/portable-validator/peer_state_diagnostic_compare_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify.go'
      - 'tools/portable-validator/peer_state_diagnostic_export.go'
      - 'tools/portable-validator/peer_state_diagnostic_v2.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/peer-state-diagnostic-compare-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/portable-validator/peer_state_diagnostic_compare.go'
      - 'tools/portable-validator/peer_state_diagnostic_compare_test.go'
      - 'tools/portable-validator/peer_state_diagnostic_verify.go'
      - 'tools/portable-validator/peer_state_diagnostic_export.go'
      - 'tools/portable-validator/peer_state_diagnostic_v2.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/peer-state-diagnostic-compare-ci.yml'

jobs:
  diagnostic-compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/portable-validator/go.mod
      - name: Go formatting check
        working-directory: tools/portable-validator
        run: |
          gofmt -w peer_state_diagnostic_compare.go peer_state_diagnostic_compare_test.go main.go
          git diff --exit-code -- peer_state_diagnostic_compare.go peer_state_diagnostic_compare_test.go main.go
      - name: Go vet
        working-directory: tools/portable-validator
        run: go vet ./...
      - name: Diagnostic compare race tests
        working-directory: tools/portable-validator
        run: go test -race ./... -run 'TestPeerStateDiagnosticCompare'
      - name: Read-only non-authority invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const compare=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_compare.go','utf8');
          const tests=fs.readFileSync('tools/portable-validator/peer_state_diagnostic_compare_test.go','utf8');
          const main=fs.readFileSync('tools/portable-validator/main.go','utf8');

          for (const required of [
            'STRATUM-PEER-STATE-DIAGNOSTIC-COMPARE/1',
            'verifyPeerStateDiagnosticBundle(bundleDir)',
            'LeftIntegrityVerified',
            'RightIntegrityVerified',
            'BundleDigestComparable',
            'BundleDigestMatch',
            'LeftBundleDigestSHA256',
            'RightBundleDigestSHA256',
            'bundleDigestComparable := leftVerification.BundleDigestVerified && rightVerification.BundleDigestVerified',
            'bundleDigestComparable && leftBundleDigest == rightBundleDigest',
            'AuthenticityEstablished:',
            'ConsensusAuthority:',
            'CanonicalHistorySelection:',
            'RecoveryAuthority:',
            'MutationPerformed:',
            'ConfigFingerprintMatch',
            'LeftConfigFingerprintSHA256',
            'RightConfigFingerprintSHA256',
            'TransportPublicKeyHashComparable',
            'TransportPublicKeyHashMatch',
            'LeftTransportPublicKeyHash',
            'RightTransportPublicKeyHash',
            'transportComparable := leftTransportHash != "" && rightTransportHash != ""',
            'transportComparable && leftTransportHash == rightTransportHash',
            'ChainIDMatch',
            'ValidatorIDMatch',
            'HealthChanges',
            'FileChanges'
          ]) if (!compare.includes(required)) throw new Error(`Missing diagnostic-compare invariant: ${required}`);

          for (const forbidden of [
            'os.WriteFile(', 'os.Remove(', 'os.RemoveAll(', 'os.Rename(',
            'savePeerSyncTrustedHeadAtomic(', 'savePeerQuarantineStateAtomic(',
            'quarantinePeer(', 'releasePeerQuarantine(', 'applyGovernedProofBundle('
          ]) if (compare.includes(forbidden)) throw new Error(`Diagnostic comparison must remain read-only; forbidden mutation surface: ${forbidden}`);

          for (const required of [
            'AuthenticityEstablished:          false',
            'ConsensusAuthority:               false',
            'CanonicalHistorySelection:        false',
            'RecoveryAuthority:                false',
            'MutationPerformed:                false'
          ]) if (!compare.includes(required)) throw new Error(`Diagnostic comparison authority flag must remain false: ${required}`);

          for (const required of [
            'TestPeerStateDiagnosticCompareRequiresVerifiedBundles',
            'TestPeerStateDiagnosticCompareReportsMetadataWithoutAuthority',
            'TestPeerStateDiagnosticCompareReportsV2BundleDigestCorrelationWithoutAuthority',
            'TestPeerStateDiagnosticCompareReportsConfigFingerprintMismatchWithoutAuthority',
            'TestPeerStateDiagnosticCompareTransportFingerprintRequiresBothHashes',
            'TestPeerStateDiagnosticCompareReportsFileHashChangeOnly',
            'TestPeerStateDiagnosticCompareReportsValidatorContextMismatch',
            'TestPeerStateDiagnosticCompareDoesNotMutateBundles'
          ]) if (!tests.includes(required)) throw new Error(`Missing diagnostic-compare regression: ${required}`);

          if (!tests.includes('version-1 bundles must remain non-comparable for version-2 canonical bundle digests')) throw new Error('Version-1 bundles must not acquire version-2 bundle-digest semantics');
          if (!tests.includes('matching canonical bundle digests must remain integrity correlation, not authenticity, fork-choice, consensus, or recovery authority')) throw new Error('Bundle-digest match must remain integrity correlation only');
          if (!tests.includes('a canonical bundle digest mismatch is diagnostic evidence only and must not choose history or authorize recovery')) throw new Error('Bundle-digest mismatch must remain diagnostic evidence only');
          if (!tests.includes('matching transport public-key fingerprints do not establish bundle authenticity or consensus authority')) throw new Error('Transport fingerprint match must remain correlation metadata only');
          if (!main.includes('case "peer-state-diagnostic-compare"') || !main.includes('peerStateDiagnosticCompareCommand')) throw new Error('peer-state-diagnostic-compare command must remain registered');
          if (!main.includes('cannot select canonical history, authorize recovery, mutate state, or establish authenticity')) throw new Error('CLI must preserve diagnostic comparison non-authority boundary');
          console.log('Diagnostic comparison verification-first/read-only/v2-digest/provenance-correlation/non-authority invariants passed');
          NODE
