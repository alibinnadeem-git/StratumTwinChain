name: One-shot diagnostic trust-anchor Redbook update

on:
  push:
    branches:
      - redbook/povi-proof-verifying-sync-runtime-v1
    paths:
      - '.github/workflows/one-shot-diagnostic-trust-anchor-redbook.yml'

permissions:
  contents: write

jobs:
  update-redbook-once:
    if: github.event.head_commit.message == 'Fix one-shot diagnostic trust anchor Redbook payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: redbook/povi-proof-verifying-sync-runtime-v1
          fetch-depth: 0
      - name: Synchronize trust-anchor lifecycle into Redbook addendum
        env:
          SECTION_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p=pathlib.Path('docs/redbook-peer-state-durability-addendum.md')
          text=p.read_text()
          marker='## Independent diagnostic bundle comparison'
          section=base64.b64decode(os.environ['SECTION_B64']).decode('ascii')
          if '## Independent diagnostic trust-anchor lifecycle' not in text:
              if marker not in text: raise SystemExit('comparison marker missing')
              text=text.replace(marker, section+marker, 1)
          ci='`STRATUM Peer State Diagnostic Trust Anchor CI` separately guards the independent append-only diagnostic trust-anchor lifecycle with formatting, `go vet`, race-tested TRUST/ROTATE/REVOKE, historical-audit, tamper, bundle-self-nomination, and non-authority regressions. The full Portable Validator matrix remains required before this lifecycle is promoted as implemented.\n\n'
          att='`STRATUM Peer State Diagnostic Attestation CI` separately guards version-2 canonical digest and detached-attestation semantics. It requires formatting, `go vet`, race-tested version-2 and attestation regressions, version-1 compatibility, verification-before-signing, exact `ED25519_TRANSPORT_IDENTITY` use, private/public key consistency, detached output, trusted-config-gated authenticity, and explicit false consensus/history/recovery/vote authority. It also contains negative source assertions preventing trusted-head mutation, quarantine mutation, governed proof application, activation, or authority escalation from entering the attestation path.\n\n'
          if ci not in text:
              if att not in text: raise SystemExit('attestation CI paragraph missing')
              text=text.replace(att, att+ci, 1)
          old='Synchronization, durable local state, diagnostic integrity, authenticated diagnostic provenance, and diagnostic comparison can make a candidate cryptographically informed and operationally resilient; they do not make it a consensus participant or establish physical truth.'
          new='Synchronization, durable local state, diagnostic integrity, authenticated diagnostic provenance, diagnostic trust-anchor lifecycle, and diagnostic comparison can make a candidate cryptographically informed and operationally resilient; they do not make it a consensus participant or establish physical truth.'
          text=text.replace(old,new,1)
          p.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/redbook-peer-state-durability-addendum.md
          git commit -m 'Document diagnostic trust anchor lifecycle in Red Book'
          git push origin HEAD:redbook/povi-proof-verifying-sync-runtime-v1
