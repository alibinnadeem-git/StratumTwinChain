name: STRATUM Operator Alert Delivery CI
on:
  pull_request:
    paths:
      - 'tools/portable-validator/peer_operator_alert_delivery*.go'
      - 'tools/portable-validator/peer_operator_alerts*.go'
      - 'tools/portable-validator/peer_sync_follower_managed.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/operator-alert-delivery-ci.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/portable-validator/peer_operator_alert_delivery*.go'
      - 'tools/portable-validator/peer_operator_alerts*.go'
      - 'tools/portable-validator/peer_sync_follower_managed.go'
      - 'tools/portable-validator/main.go'
      - '.github/workflows/operator-alert-delivery-ci.yml'

jobs:
  operator-alert-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/portable-validator/go.mod
      - name: Go formatting check
        working-directory: tools/portable-validator
        run: |
          gofmt -w peer_operator_alert_delivery*.go peer_sync_follower_managed.go main.go
          git diff --exit-code -- peer_operator_alert_delivery*.go peer_sync_follower_managed.go main.go
      - name: Go vet
        working-directory: tools/portable-validator
        run: go vet ./...
      - name: Operator alert delivery tests
        working-directory: tools/portable-validator
        run: go test -race ./... -run 'Test(ValidateOperatorAlertWebhookURL|DeliverPeerOperatorAlertWebhook|FailedWebhookDelivery|OperatorAlertDeliveryJournal|AppendOperatorAlertDeliveryReceipt|BearerTokenFile|PeerOperatorAlertByID|PeerOperatorAlertDeliveryStatus|PeerOperatorAlertDeliveryRetryStatus|DeliveryStatusFilter|PrunePeerOperatorAlertDeliveryReceipts|PendingPeerOperatorAlertsForWebhook|EligiblePeerOperatorAlertsForWebhook|DeliveryStateSurvivesReceiptPruning|AutoDeliverPendingPeerOperatorAlerts|LoadPeerOperatorAlertDeliveryJournal)'
      - name: Alert delivery trust-boundary invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const delivery=fs.readFileSync('tools/portable-validator/peer_operator_alert_delivery.go','utf8');
          const autoDelivery=fs.readFileSync('tools/portable-validator/peer_operator_alert_auto_delivery.go','utf8');
          const follower=fs.readFileSync('tools/portable-validator/peer_sync_follower_managed.go','utf8');
          const status=fs.readFileSync('tools/portable-validator/peer_operator_alert_delivery_command.go','utf8');
          const retention=fs.readFileSync('tools/portable-validator/peer_operator_alert_delivery_retention.go','utf8');
          const main=fs.readFileSync('tools/portable-validator/main.go','utf8');
          for (const required of [
            'STRATUM-PEER-ALERT-DELIVERY/1',
            'ConsensusAuthority',
            'SafetyStateMutation',
            'peer operator alert delivery must never carry consensus authority',
            'plaintext HTTP refused for non-loopback operator alert webhook',
            'State              map[string]PeerOperatorAlertDeliveryState',
            'applyPeerOperatorAlertDeliveryReceiptState(&journal, receipt)',
            'len(journal.State) == 0 && len(journal.Receipts) > 0',
            'reconstruct operator alert delivery state from retained receipts',
          ]) {
            if (!delivery.includes(required)) throw new Error(`Missing alert-delivery safety/durability/migration invariant: ${required}`);
          }
          for (const required of [
            'peer-alert-deliver-webhook',
            'peerOperatorAlertDeliverWebhookCommand',
            'peer-alert-delivery-status',
            'peerOperatorAlertDeliveryStatusCommand',
            'peer-alert-delivery-prune',
            'peerOperatorAlertDeliveryPruneCommand',
          ]) {
            if (!main.includes(required)) throw new Error(`Missing alert-delivery command surface: ${required}`);
          }
          for (const required of [
            'alert-webhook',
            'alert-bearer-token-file',
            'alert-delivery-state',
            'alert-delivery-timeout',
            'autoDeliverPendingPeerOperatorAlertsContext',
            'best-effort failure; follower safety state unchanged',
          ]) {
            if (!follower.includes(required)) throw new Error(`Missing automatic follower alert-delivery boundary: ${required}`);
          }
          for (const required of [
            'peerOperatorAlertRetryBaseDelay          = time.Minute',
            'peerOperatorAlertRetryMaxDelay           = time.Hour',
            'eligiblePeerOperatorAlertsForWebhookAt',
            'peerOperatorAlertRetryDelay',
            'peerOperatorAlertAutoDeliveryMaxPerCycle = 16',
            'deliveries.State[operatorAlertDeliveryStateKey',
            'latestFailure.Add(peerOperatorAlertRetryDelay(state.FailureCount))',
          ]) {
            if (!autoDelivery.includes(required)) throw new Error(`Missing bounded durable automatic alert retry invariant: ${required}`);
          }
          if (!status.includes('deliveries.State[operatorAlertDeliveryStateKey')) throw new Error('Read-only retry status must use compact durable delivery state rather than prunable receipts');
          if (!delivery.includes('cfg.State != candidateState || cfg.VoteAuthority')) throw new Error('Alert delivery must fail closed outside CANDIDATE/voteAuthority=false');
          if (!autoDelivery.includes('cfg.State != candidateState || cfg.VoteAuthority')) throw new Error('Automatic alert delivery must fail closed outside CANDIDATE/voteAuthority=false');
          if (!status.includes('cfg.State != candidateState || cfg.VoteAuthority')) throw new Error('Alert delivery status must fail closed outside CANDIDATE/voteAuthority=false');
          if (!retention.includes('cfg.State != candidateState || cfg.VoteAuthority')) throw new Error('Alert delivery retention must fail closed outside CANDIDATE/voteAuthority=false');
          if (!delivery.includes('CheckRedirect') || !delivery.includes('http.ErrUseLastResponse')) throw new Error('Alert delivery must refuse redirect-following that could leak authorization headers or bypass endpoint policy');
          if (!delivery.includes('bearer-token-file') || !delivery.includes('Authorization')) throw new Error('Alert delivery must support secret-file bearer auth rather than command-line token material');
          if (!delivery.includes('http.NewRequestWithContext')) throw new Error('Follower-triggered alert delivery must support cancellation');
          if (!delivery.includes('prunePeerOperatorAlertDeliveryReceipts(journal, peerOperatorAlertDeliveryMaxReceipts)')) throw new Error('Every normal receipt append must enforce the hard retention cap');
          if (!retention.includes('peerOperatorAlertDeliveryMaxReceipts = 4096')) throw new Error('Alert delivery receipts must have a hard upper retention bound');
          if (!retention.includes('savePeerOperatorAlertDeliveryJournalAtomic')) throw new Error('Retention may persist only the delivery receipt journal');
          if (autoDelivery.includes('for _, receipt := range deliveries.Receipts')) throw new Error('Automatic delivery eligibility must not derive durable dedup/retry semantics from prunable receipt history');
          if (status.includes('for _, receipt := range deliveries.Receipts')) throw new Error('Retry-status semantics must not derive from prunable receipt history');
          if (autoDelivery.includes('deadLetter') || autoDelivery.includes('permanentFailure')) throw new Error('Automatic alert delivery must not silently dead-letter or permanently drop alerts');
          for (const forbidden of [
            'acknowledgePeerOperatorAlert(',
            'peerQuarantineReleaseCommand(',
            'releasePeerQuarantine(',
            'savePeerQuarantineStateAtomic(',
            'savePeerSyncTrustedHeadAtomic(',
            'applyGovernedProofBundle(',
          ]) {
            if (delivery.includes(forbidden)) throw new Error(`Alert delivery must not mutate safety/trust state through ${forbidden}`);
            if (autoDelivery.includes(forbidden)) throw new Error(`Automatic alert delivery must not mutate safety/trust state through ${forbidden}`);
            if (status.includes(forbidden)) throw new Error(`Alert delivery status must remain read-only and not call ${forbidden}`);
            if (retention.includes(forbidden)) throw new Error(`Alert delivery retention must not touch safety/trust state through ${forbidden}`);
          }
          for (const forbidden of ['os.WriteFile(', 'os.Rename(', 'savePeerOperatorAlertDeliveryJournalAtomic(', 'appendPeerOperatorAlertDeliveryReceipt(']) {
            if (status.includes(forbidden)) throw new Error(`Alert delivery status must not persist or mutate delivery state through ${forbidden}`);
          }
          if (follower.includes('err = autoDeliverPendingPeerOperatorAlertsContext')) throw new Error('Automatic delivery failure must never replace the follower cycle result');
          console.log('One-way non-authoritative alert delivery, legacy migration, compact durable dedup/retry state, bounded retry scheduling, read-only status, and bounded receipt-retention invariants passed');
          NODE
