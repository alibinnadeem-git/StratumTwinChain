name: STRATUM Spatial Verified CI

on:
  push:
    branches:
      - main
      - 'redbook/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Redbook terminology conformance
        run: npm run qa:redbook
      - name: Genesis hash conformance
        run: npm run qa:genesis
      - name: Genesis trust certificate conformance
        run: npm run qa:genesis-trust
      - name: Snapshot trust conformance
        run: npm run qa:snapshot
      - name: PFC and DIR finality conformance
        run: npm run qa:finality
      - name: Validator governance conformance
        run: npm run qa:validator-governance
      - name: PoVI round-change liveness conformance
        run: npm run qa:round-change
      - name: PoVI PLC safe-reproposal conformance
        run: npm run qa:plc
      - name: PoVI proposer entropy profile conformance
        run: npm run qa:vrf
      - name: Asset archive and restore safety conformance
        run: npm run qa:asset-archive
      - name: Command center tenant and truth-boundary conformance
        run: npm run qa:command-center
      - name: One-time account provisioning safety conformance
        run: npm run qa:auth-provisioning
      - name: Spatial persistence and human-review conformance
        run: npm run qa:spatial-persistence
      - name: Legacy direct Spatial ingest remains disabled
        run: npm run qa:legacy-spatial-ingest
      - name: Production database bootstrap migration conformance
        run: npm run qa:database-bootstrap
      - name: Managed database and auth runtime conformance
        run: npm run qa:runtime-config
      - name: Physical-device release UAT safety conformance
        run: npm run qa:release-uat
      - name: Database and server-backed persistence readiness conformance
        run: npm run qa:database-readiness
      - name: Metric Spatial viewer, Z placement and SLD projection conformance
        run: npm run qa:spatial-viewer
      - name: SLD content recognition and Spatial ingest conformance
        run: npm run qa:sld-spatial
      - name: Expected power and missing-feed intelligence conformance
        run: npm run qa:power-intelligence
      - name: Spatial asset click and DIR Passport conformance
        run: npm run qa:spatial-asset-passport
      - name: PDF title-block intelligence conformance
        run: npm run qa:title-block
      - name: Automatic sheet alignment conformance
        run: npm run qa:auto-alignment
      - name: Room reconstruction and HITL conformance
        run: npm run qa:room-reconstruction
      - name: Field scan tenant identity conformance
        run: npm run qa:field-scan
      - name: Physical identity LOOKUP_ONLY conformance
        run: npm run qa:physical-identity
      - name: Asset Passport truth-boundary conformance
        run: npm run qa:asset-passport
      - name: Typed human attestation conformance
        run: npm run qa:human-attestations
      - name: Offline field queue and replay conformance
        run: npm run qa:offline-field
      - name: Reality Validation Observed/Verified truth-boundary conformance
        run: npm run qa:reality-validation
      - name: Accessibility foundation conformance
        run: npm run qa:accessibility
      - name: Product agent release gate
        run: npm run qa:agent-product
      - name: Design agent release gate
        run: npm run qa:agent-design
      - name: UI UX agent release gate
        run: npm run qa:agent-uiux
      - name: Security agent release gate
        run: npm run qa:agent-security
      - name: QA agent release gate
        run: npm run qa:agent-quality
      - run: npm run qa:ui
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for browser UAT
        run: npx playwright install --with-deps chromium
      - name: Run desktop tablet mobile browser UAT
        run: npm run qa:e2e
      - name: Upload browser UAT report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
