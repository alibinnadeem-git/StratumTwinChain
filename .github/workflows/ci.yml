name: STRATUM Spatial Verified CI

on:
  push:
    branches:
      - main
      - 'redbook/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Redbook terminology conformance
        run: npm run qa:redbook
      - name: Genesis hash conformance
        run: npm run qa:genesis
      - name: Genesis trust certificate conformance
        run: npm run qa:genesis-trust
      - name: Snapshot trust conformance
        run: npm run qa:snapshot
      - name: PFC and DIR finality conformance
        run: npm run qa:finality
      - name: Validator governance conformance
        run: npm run qa:validator-governance
      - name: Protocol governance conformance
        run: npm run qa:protocol-governance
      - run: npm run qa:ui
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for browser UAT
        run: npx playwright install --with-deps chromium
      - name: Run desktop tablet mobile browser UAT
        run: npm run qa:e2e
      - name: Upload browser UAT report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
