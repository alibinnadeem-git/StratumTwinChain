name: STRATUM Spatial Verified CI

on:
  push:
    branches:
      - main
      - 'redbook/**'
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Redbook terminology conformance
        run: npm run qa:redbook
      - name: Genesis hash conformance
        run: npm run qa:genesis
      - name: Genesis trust certificate conformance
        run: npm run qa:genesis-trust
      - name: Snapshot trust conformance
        run: npm run qa:snapshot
      - name: PFC and DIR finality conformance
        run: npm run qa:finality
      - name: Validator governance conformance
        run: npm run qa:validator-governance
      - name: PoVI round-change liveness conformance
        run: npm run qa:round-change
      - name: PoVI PLC safe-reproposal conformance
        run: npm run qa:plc
      - name: PoVI proposer entropy profile conformance
        run: npm run qa:vrf
      - name: Asset archive and restore safety conformance
        run: npm run qa:asset-archive
      - name: Command center tenant and truth-boundary conformance
        run: npm run qa:command-center
      - name: One-time account provisioning safety conformance
        run: npm run qa:auth-provisioning
      - name: Spatial persistence and human-review conformance
        run: npm run qa:spatial-persistence
      - name: Legacy direct Spatial ingest remains disabled
        run: npm run qa:legacy-spatial-ingest
      - name: Production database bootstrap migration conformance
        run: npm run qa:database-bootstrap
      - name: Managed database and auth runtime conformance
        run: npm run qa:runtime-config
      - name: Physical-device release UAT safety conformance
        run: npm run qa:release-uat
      - name: Database and server-backed persistence readiness conformance
        run: npm run qa:database-readiness
      - name: Metric Spatial viewer, Z placement and SLD projection conformance
        run: npm run qa:spatial-viewer
      - name: Site-plan PDF basemap retention and truth-boundary conformance
        run: npm run qa:site-plan-basemap
      - name: Non-SLD plan recognition and sheet isolation conformance
        run: npm run qa:non-sld-plans
      - name: Brynhurst golden electrical comprehension conformance
        run: npm run qa:brynhurst-golden
      - name: Stale drawing reprocess and replacement conformance
        run: npm run qa:stale-drawing-reprocess
      - name: Browser-local source archive conformance
        run: npm run qa:source-browser-archive
      - name: Project source vault security and recovery conformance
        run: npm run qa:project-source-vault
      - name: OEM CAD registry provenance and activation conformance
        run: npm run qa:oem-cad-registry
      - name: OEM CAD source file verification conformance
        run: npm run qa:oem-cad-verification
      - name: SLD content recognition and Spatial ingest conformance
        run: npm run qa:sld-spatial
      - name: Expected power and missing-feed intelligence conformance
        run: npm run qa:power-intelligence
      - name: Equipment schedule ingestion conformance
        run: npm run qa:equipment-schedule
      - name: Engineering knowledge, power persistence and maintenance conformance
        run: npm run qa:engineering-knowledge
      - name: Cross-document coordination intelligence conformance
        run: npm run qa:coordination-intelligence
      - name: Spatial coordination review overlay conformance
        run: npm run qa:spatial-coordination-review
      - name: Structured XLSX and DOCX ingestion conformance
        run: npm run qa:office-ingestion
      - name: IFC BIM semantic and placement ingestion conformance
        run: npm run qa:ifc-ingestion
      - name: Scanned-image OCR review-evidence conformance
        run: npm run qa:image-ocr
      - name: Scanned PDF OCR fallback conformance
        run: npm run qa:pdf-ocr
      - name: Responsive native PDF worker conformance
        run: npm run qa:pdf-worker
      - name: Spatial asset click and DIR Passport conformance
        run: npm run qa:spatial-asset-passport
      - name: PDF title-block intelligence conformance
        run: npm run qa:title-block
      - name: Automatic sheet alignment conformance
        run: npm run qa:auto-alignment
      - name: Evidence-based Z resolver conformance
        run: npm run qa:z-resolver
      - name: Vertical Z reference semantics conformance
        run: npm run qa:z-reference
      - name: Reconciled Z solution chain conformance
        run: npm run qa:z-solution
      - name: Authenticated Z review provenance conformance
        run: npm run qa:z-review-persistence
      - name: Project datum review-surface conformance
        run: npm run qa:project-datum
      - name: Local triangulated elevation surface conformance
        run: npm run qa:elevation-surface
      - name: Reviewed cross-sheet elevation transfer conformance
        run: npm run qa:cross-sheet-z
      - name: Independent scale validation conformance
        run: npm run qa:scale-validation
      - name: Demo-safe unresolved placement conformance
        run: npm run qa:demo-safe-placement
      - name: Local support-surface equipment placement conformance
        run: npm run qa:local-surface-placement
      - name: Source support-base offset Z conformance
        run: npm run qa:support-base-offset
      - name: Room reconstruction and HITL conformance
        run: npm run qa:room-reconstruction
      - name: Field scan tenant identity conformance
        run: npm run qa:field-scan
      - name: Physical identity LOOKUP_ONLY conformance
        run: npm run qa:physical-identity
      - name: Asset Passport truth-boundary conformance
        run: npm run qa:asset-passport
      - name: Typed human attestation conformance
        run: npm run qa:human-attestations
      - name: Offline field queue and replay conformance
        run: npm run qa:offline-field
      - name: Reality Validation Observed/Verified truth-boundary conformance
        run: npm run qa:reality-validation
      - name: Accessibility foundation conformance
        run: npm run qa:accessibility
      - name: Product agent release gate
        run: npm run qa:agent-product
      - name: Design agent release gate
        run: npm run qa:agent-design
      - name: UI UX agent release gate
        run: npm run qa:agent-uiux
      - name: Security agent release gate
        run: npm run qa:agent-security
      - name: QA agent release gate
        run: npm run qa:agent-quality
      - run: npm run qa:ui
      - run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for browser UAT
        run: npx playwright install --with-deps chromium
      - name: Run desktop tablet mobile browser UAT
        run: npm run qa:e2e
        env:
          STRATUM_CAPTURE_DIR: test-results/spatial-master-fix-screenshots
      - name: Attach sanitized Spatial screenshots to PR checks
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spatial-master-fix-desktop-tablet-mobile
          path: test-results/spatial-master-fix-screenshots
          if-no-files-found: ignore
          retention-days: 30
      - name: Upload browser UAT report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7


  authenticated-spatial-persistence:
    name: Authenticated Spatial persistence golden path
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: stratum
          POSTGRES_PASSWORD: stratum-e2e
          POSTGRES_DB: stratum_spatial_verified
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stratum -d stratum_spatial_verified"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://stratum:stratum-e2e@127.0.0.1:5432/stratum_spatial_verified?sslmode=disable
      AUTH_SECRET: stratum-e2e-auth-secret-2026-is-disposable-and-ci-only
      STRATUM_E2E_SERVER_PERSISTENCE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Apply schema to disposable PostgreSQL
        run: npm run db:migrate -- --apply
      - name: Seed isolated tenant fixtures
        run: node scripts/seed-e2e-spatial-persistence.mjs
      - name: Typecheck authenticated persistence additions
        run: npm run typecheck
      - name: Build production application against disposable runtime
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Prove authenticated save reload and tenant isolation
        run: npm run qa:e2e-server-persistence
      - name: Upload authenticated persistence report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-spatial-persistence-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
