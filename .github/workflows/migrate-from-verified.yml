name: One-time migrate STRATUM Verified into Twin Chain

on:
  push:
    paths:
      - '.github/workflows/migrate-from-verified.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout STRATUM Twin Chain
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull canonical working source
        run: |
          git clone --depth 1 https://github.com/alibinnadeem-git/stratum-verified.git /tmp/stratum-verified

      - name: Consolidate complete application
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/migrate-from-verified.yml' \
            /tmp/stratum-verified/ ./
          node - <<'NODE'
          const fs=require('fs');
          const p=JSON.parse(fs.readFileSync('package.json','utf8'));
          p.name='@stratum/twin-chain';
          p.version='0.4.0';
          fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');
          NODE
          cat > README.md <<'EOF'
          # STRATUM Twin Chain

          Canonical STRATUM infrastructure trust platform combining STRATUM Twin, STRATUM Verified, and STRATUM Chain.

          ## Core flow

          Design / BIM / GLB / GLTF → STRATUM Twin → durable STRATUM Verified asset identities → lifecycle evidence → canonical hashing → LedgerAdapter → STRATUM Chain → validator-backed verification.

          ## Privacy boundary

          Private model, commercial, operational, and evidence data stays off-chain. Only cryptographic hashes, opaque identifiers, timestamps, and proof metadata cross into the trust layer.

          ## Primary application routes

          - `/twin` — interactive digital twin and model ingestion
          - `/assets` — verified asset passports
          - `/workflows` — install and commissioning lifecycle
          - `/maintenance` — maintenance lifecycle
          - `/evidence` — evidence records
          - `/provenance` — provenance
          - `/verify` — public verification
          - `/chain` — STRATUM Chain explorer
          - `/admin` — RBAC administration
          EOF

      - name: Commit canonical migration
        run: |
          git config user.name "STRATUM Migration Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes to commit"
          else
            git commit -m "Consolidate STRATUM Verified, Twin Engine and Chain into canonical repository"
            git push origin HEAD:main
          fi
