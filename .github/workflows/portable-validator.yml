name: STRATUM Portable Validator CI
on:
  pull_request:
    paths:
      - 'tools/portable-validator/**'
      - 'lib/redbook/genesis.ts'
      - 'lib/redbook/genesis-trust.ts'
      - 'lib/redbook/snapshot-trust.ts'
      - 'lib/redbook/finality-proof.ts'
      - 'lib/redbook/validator-governance.ts'
      - 'lib/redbook/povi/**'
      - 'lib/redbook/schema/bootstrap.ts'
      - 'lib/redbook/schema/snapshot.ts'
      - 'lib/redbook/schema/finality.ts'
      - 'lib/redbook/schema/validator-governance.ts'
      - 'lib/redbook/schema/liveness.ts'
      - 'lib/redbook/schema/plc.ts'
      - 'lib/redbook/schema/vrf.ts'
      - 'lib/redbook/test-vectors/**'
      - 'scripts/genesis-conformance.mjs'
      - 'scripts/genesis-trust-conformance.mjs'
      - 'scripts/snapshot-conformance.mjs'
      - 'scripts/finality-conformance.mjs'
      - 'scripts/validator-governance-conformance.mjs'
      - 'scripts/round-change-conformance.mjs'
      - 'scripts/plc-conformance.mjs'
      - 'scripts/vrf-proposer-conformance.mjs'
      - '.github/workflows/portable-validator.yml'
  push:
    branches-ignore: [main]
    paths:
      - 'tools/portable-validator/**'
      - 'lib/redbook/genesis.ts'
      - 'lib/redbook/genesis-trust.ts'
      - 'lib/redbook/snapshot-trust.ts'
      - 'lib/redbook/finality-proof.ts'
      - 'lib/redbook/validator-governance.ts'
      - 'lib/redbook/povi/**'
      - 'lib/redbook/schema/bootstrap.ts'
      - 'lib/redbook/schema/snapshot.ts'
      - 'lib/redbook/schema/finality.ts'
      - 'lib/redbook/schema/validator-governance.ts'
      - 'lib/redbook/schema/liveness.ts'
      - 'lib/redbook/schema/plc.ts'
      - 'lib/redbook/schema/vrf.ts'
      - 'lib/redbook/test-vectors/**'
      - 'scripts/genesis-conformance.mjs'
      - 'scripts/genesis-trust-conformance.mjs'
      - 'scripts/snapshot-conformance.mjs'
      - 'scripts/finality-conformance.mjs'
      - 'scripts/validator-governance-conformance.mjs'
      - 'scripts/round-change-conformance.mjs'
      - 'scripts/plc-conformance.mjs'
      - 'scripts/vrf-proposer-conformance.mjs'
      - '.github/workflows/portable-validator.yml'
jobs:
  portable-validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Genesis cross-language test vector
        run: node scripts/genesis-conformance.mjs
      - name: Genesis trust certificate test vector
        run: node scripts/genesis-trust-conformance.mjs
      - name: Snapshot certificate test vector
        run: node scripts/snapshot-conformance.mjs
      - name: PFC and DIR continuity test vector
        run: node scripts/finality-conformance.mjs
      - name: Validator governance test vector
        run: node scripts/validator-governance-conformance.mjs
      - name: PoVI round-change liveness test vector
        run: node scripts/round-change-conformance.mjs
      - name: PoVI PLC safe-reproposal test vector
        run: node scripts/plc-conformance.mjs
      - name: PoVI proposer entropy profile test vector
        run: node scripts/vrf-proposer-conformance.mjs
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24.x'
          cache-dependency-path: tools/portable-validator/go.mod
      - name: Normalize Go formatting in CI workspace
        working-directory: tools/portable-validator
        run: gofmt -w .
      - name: Go vet
        working-directory: tools/portable-validator
        run: go vet ./...
      - name: Unit and safety tests
        working-directory: tools/portable-validator
        run: go test -race ./...
      - name: Build host binary
        working-directory: tools/portable-validator
        run: go build -trimpath -o /tmp/stratum-validator-bootstrap .
      - name: Cross-compile Linux ARM64 Raspberry Pi target
        working-directory: tools/portable-validator
        run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o /tmp/stratum-validator-bootstrap-linux-arm64 .
      - name: Cross-compile Linux AMD64 target
        working-directory: tools/portable-validator
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/stratum-validator-bootstrap-linux-amd64 .
      - name: Cross-compile macOS ARM64 target
        working-directory: tools/portable-validator
        run: CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o /tmp/stratum-validator-bootstrap-darwin-arm64 .
      - name: Cross-compile Windows AMD64 target
        working-directory: tools/portable-validator
        run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o /tmp/stratum-validator-bootstrap-windows-amd64.exe .
      - name: Portable-validator safety invariants
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const source=fs.readFileSync('tools/portable-validator/bootstrap.go','utf8');
          for(const required of [
            'candidateState   = "CANDIDATE"',
            'VoteAuthority',
            'GOVERNANCE_ACTIVATION_REQUIRED',
            'VRF_CONFORMANCE_NOT_YET_IMPLEMENTED',
            'LIVE_POVI_NETWORK_EXECUTION_NOT_YET_IMPLEMENTED',
            'STRATUM_ENROLLMENT_CODE',
            'keys/private',
            'publisher signature verification failed'
          ]) if(!source.includes(required)) throw new Error(`Missing portable validator invariant: ${required}`);
          if(source.includes('FULL_GENESIS_PROOF_VERIFIER_NOT_YET_IMPLEMENTED')) throw new Error('Obsolete Genesis activation blocker must not return after canonical Genesis + threshold trust verification shipped');
          if(source.includes('fs.String("enrollment-code"')) throw new Error('Raw enrollment secret must not be accepted as a command-line value');
          const dispatcher=fs.readFileSync('tools/portable-validator/main.go','utf8');
          if(/case\s+"(activate|vote|force-active)"/.test(dispatcher)) throw new Error('Bootstrap must not expose vote-authority or activation commands');
          for(const required of ['verify-genesis-trust','verify-snapshot','verify-finality','verify-validator-governance','verify-round-change','verify-plc','verify-proposer']) if(!dispatcher.includes(required)) throw new Error(`Portable validator missing trust command: ${required}`);
          const genesis=fs.readFileSync('tools/portable-validator/genesis.go','utf8');
          for(const required of ['STRATUM/GENESIS/DIR/1','STRATUM-GENESIS-HASH/1','objectId','GenesisDIRHash','maxSafeJSONInteger']) if(!genesis.includes(required)) throw new Error(`Missing Genesis verifier invariant: ${required}`);
          const trust=fs.readFileSync('tools/portable-validator/trust.go','utf8');
          for(const required of ['STRATUM/BOOTSTRAP/TRUST/1','STRATUM-GENESIS-CERT/1','bootstrap trust bundle pin mismatch','duplicate Genesis signer','Genesis trust threshold not met','ed25519.Verify']) if(!trust.includes(required)) throw new Error(`Missing Genesis trust invariant: ${required}`);
          const snapshot=fs.readFileSync('tools/portable-validator/snapshot.go','utf8');
          for(const required of ['STRATUM/SNAPSHOT/CERT/1','STRATUM/VALIDATOR_SET/1','exactly one active CONSENSUS key','trusted validator-set root mismatch','snapshot PoVI quorum not met','ed25519.Verify']) if(!snapshot.includes(required)) throw new Error(`Missing snapshot trust invariant: ${required}`);
          const finality=fs.readFileSync('tools/portable-validator/finality.go','utf8');
          for(const required of ['STRATUM/PFC/PROOF/1','STRATUM/POVI/COMMIT/1','DIR previousDIRHash does not continue the trusted head','PFC PoVI quorum not met','PFC signerIds do not exactly match valid COMMIT signatures','DIRHash mismatch','ed25519.Verify']) if(!finality.includes(required)) throw new Error(`Missing finality invariant: ${required}`);
          const governance=fs.readFileSync('tools/portable-validator/validator_governance.go','utf8');
          for(const required of ['STRATUM-VALIDATOR-GOVERNANCE/1','STRATUM/VALIDATOR_SET_CHANGE/1','independently trusted policy','validator governance supermajority not met','unrelated validator','previous CONSENSUS key must retire exactly at the effective height','ed25519.Verify']) if(!governance.includes(required)) throw new Error(`Missing validator governance invariant: ${required}`);
          const liveness=fs.readFileSync('tools/portable-validator/liveness.go','utf8');
          for(const required of ['STRATUM/POVI/VERIFY/1','STRATUM/POVI/ROUND_CHANGE/1','STRATUM-ROUND-CHANGE-EVIDENCE/1','NIL VERIFY quorum not met','ROUND_CHANGE quorum not met','never authorizes a safe unlock','ed25519.Verify']) if(!liveness.includes(required)) throw new Error(`Missing round-change liveness invariant: ${required}`);
          const plc=fs.readFileSync('tools/portable-validator/plc.go','utf8');
          for(const required of ['STRATUM-PLC-PROOF/1','STRATUM/PLC/PROOF/1','PLC PoVI quorum not met','PLC signerIds do not exactly match valid VERIFY signatures','verifyConsensusHashSignature']) if(!plc.includes(required)) throw new Error(`Missing PLC invariant: ${required}`);
          const proposer=fs.readFileSync('tools/portable-validator/vrf.go','utf8');
          for(const required of ['STRATUM-POVI-PROPOSER/1','STRATUM/POVI/PROPOSER_SELECTION/1','STRATUM/POVI/VRF_EVIDENCE/1','STRATUM-VRF-KEY-REGISTRY/1','VRF-key registry must cover exactly the ACTIVE validator set','wrong proposer','ed25519.Verify']) if(!proposer.includes(required)) throw new Error(`Missing proposer entropy invariant: ${required}`);
          console.log('Portable validator candidate-only, Genesis, snapshot, finality, validator-governance, round-change liveness, PLC, and proposer-entropy invariants passed');
          NODE
